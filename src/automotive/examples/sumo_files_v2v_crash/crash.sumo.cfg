<configuration>
    <input>
        <net-file value="crash.net.xml"/>
        <route-files value="crash.rou.xml"/>
        <gui-settings-file value="file.settings.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="60"/>
        <step-length value="0.01"/>
    </time>
    <processing>
        <!-- "warn" = SUMO logs every collision to stdout but keeps running.
             Crashed vehicles are NOT removed, so HarmLogger keeps writing
             rows for every pair. That's how baseline (with crashes) and
             algorithm (without) become directly comparable on the new
             min(gap) / min(ttc) / peak(energy) columns. -->
        <collision.action value="warn"/>
        <collision.check-junctions value="false"/>
        <collision.mingap-factor value="0"/>
    </processing>
</configuration>
